name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Cache WASM Tools
        id: cache-wasm-tools
        uses: actions/cache@v5.0.2
        with:
          path: ~/.dotnet/workloads
          key: ${{ runner.os }}-wasm-tools-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
      - name: Install WASM Tools
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools
      - name: Restore dependencies
        run: dotnet restore ContestJudging.slnx
      - name: Check Formatting
        run: dotnet format ContestJudging.slnx --verify-no-changes
      - name: Clean
        run: dotnet clean ContestJudging.slnx --configuration Release
      - name: Build
        # wasm-tools are required to link native SQLite assets even without AOT
        run: dotnet build ContestJudging.slnx --configuration Release --no-restore
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Tests
        run: dotnet test ContestJudging.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/
      - name: Publish Blazor WASM
        run: dotnet publish src/ContestJudging.Web/ContestJudging.Web.csproj -c Release -o publish --nologo
      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v5
        with:
          name: blazor-publish
          path: publish/wwwroot/
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          # --allow-no-lockfiles: Project has no package-lock.json, packages.lock.json,
          # yarn.lock, or pnpm-lock.yaml. OSV-Scanner requires this flag to scan
          # dependency manifests (e.g. .csproj) without a lockfile present.
          scan-args: ./ --allow-no-lockfiles
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ContestJudging.slnx --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-and-test, security-scan, codeql-analysis]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Publish Artifact
        uses: actions/download-artifact@v5
        with:
          name: blazor-publish
          path: release/wwwroot/
      - name: Rewrite base href for GitHub Pages
        run: sed -i 's/<base href="\/" \/>/<base href="\/eoh-2026-judging\/" \/>/g' release/wwwroot/index.html
      # GitHub Pages doesn't support SPA routing well by default (returns 404 on refresh)
      # We'll copy index.html to 404.html as a common workaround
      - name: Fix SPA Routing for GitHub Pages
        run: cp release/wwwroot/index.html release/wwwroot/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3.1.3
        with:
          path: release/wwwroot
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.1.2
