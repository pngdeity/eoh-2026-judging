name: CodeQL
on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.razor'
      - '**/*.csproj'
      - '*.slnx'
      - 'Directory.*.props'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.razor'
      - '**/*.csproj'
      - '*.slnx'
      - 'Directory.*.props'
jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: manual
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'
      - name: Cache WASM Tools
        id: cache-wasm-tools
        uses: actions/cache@v5.0.5
        with:
          path: ~/.dotnet/workloads
          key: ${{ runner.os }}-wasm-tools-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
      - name: Install WASM Tools
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools
      - name: Build
        run: dotnet build ContestJudging.slnx --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
